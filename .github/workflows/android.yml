name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest assembleDebug
      - name: Verify APK integrity and signature
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - name: Upload UI verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/ui-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: imgbed-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "imgbed-android-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "imgbed-android-${GITHUB_REF_NAME}.apk" \
            --title "ImgBed Android ${GITHUB_REF_NAME}" \
            --generate-notes
